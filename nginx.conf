server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Clean routes used by the app / vercel.json
    location = /deck { return 302 /deck-v2.html; }
    location = /deck/ { return 302 /deck-v2.html; }
    location = /deck-v2 { return 302 /deck-v2.html; }
    location = /deck-v2/ { return 302 /deck-v2.html; }
    location = /login { return 302 /login.html; }
    location = /login/ { return 302 /login.html; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|pdf|csv|json)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
